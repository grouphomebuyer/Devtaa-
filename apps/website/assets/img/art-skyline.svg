<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of a residential skyline at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A211B"/>
      <stop offset="42%" stop-color="#14453A"/>
      <stop offset="74%" stop-color="#3E6B58"/>
      <stop offset="100%" stop-color="#9A8E6E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DCBE83" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#DCBE83" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C5344"/>
      <stop offset="100%" stop-color="#0E2E26"/>
    </linearGradient>
    <linearGradient id="towerMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143F34"/>
      <stop offset="100%" stop-color="#0A211B"/>
    </linearGradient>
    <pattern id="win" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="10" height="14" fill="#DCBE83" opacity=".5"/>
    </pattern>
    <pattern id="winDim" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="12" height="16" fill="#C6A15B" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="640" r="86" fill="#DCBE83" opacity=".22"/>
  <circle cx="1180" cy="640" r="46" fill="#F3E8D2" opacity=".35"/>
  <rect y="470" width="1600" height="430" fill="url(#glow)"/>

  <!-- far layer -->
  <g opacity=".55">
    <rect x="60" y="430" width="120" height="470" fill="url(#towerFar)"/>
    <rect x="60" y="430" width="120" height="470" fill="url(#winDim)"/>
    <rect x="210" y="500" width="90" height="400" fill="url(#towerFar)"/>
    <rect x="210" y="500" width="90" height="400" fill="url(#winDim)"/>
    <rect x="1310" y="455" width="130" height="445" fill="url(#towerFar)"/>
    <rect x="1310" y="455" width="130" height="445" fill="url(#winDim)"/>
    <rect x="1465" y="520" width="100" height="380" fill="url(#towerFar)"/>
    <rect x="1465" y="520" width="100" height="380" fill="url(#winDim)"/>
  </g>

  <!-- mid layer -->
  <g>
    <rect x="330" y="330" width="170" height="570" fill="url(#towerMid)"/>
    <rect x="342" y="360" width="146" height="510" fill="url(#win)" opacity=".8"/>
    <rect x="330" y="330" width="170" height="10" fill="#C6A15B" opacity=".5"/>

    <rect x="530" y="245" width="200" height="655" fill="url(#towerMid)"/>
    <rect x="544" y="278" width="172" height="580" fill="url(#win)"/>
    <rect x="530" y="245" width="200" height="10" fill="#DCBE83" opacity=".65"/>
    <rect x="620" y="200" width="18" height="48" fill="#0A211B"/>

    <rect x="760" y="390" width="150" height="510" fill="url(#towerMid)"/>
    <rect x="772" y="418" width="126" height="450" fill="url(#win)" opacity=".7"/>

    <rect x="940" y="300" width="185" height="600" fill="url(#towerMid)"/>
    <rect x="954" y="332" width="157" height="530" fill="url(#win)" opacity=".9"/>
    <rect x="940" y="300" width="185" height="10" fill="#C6A15B" opacity=".5"/>

    <rect x="1155" y="425" width="130" height="475" fill="url(#towerMid)"/>
    <rect x="1167" y="452" width="106" height="420" fill="url(#win)" opacity=".6"/>
  </g>

  <!-- low-rise podium band -->
  <rect y="800" width="1600" height="100" fill="#081914"/>
  <g fill="#DCBE83" opacity=".28">
    <rect x="40" y="828" width="26" height="16"/><rect x="96" y="828" width="26" height="16"/>
    <rect x="152" y="828" width="26" height="16"/><rect x="208" y="828" width="26" height="16"/>
    <rect x="380" y="828" width="26" height="16"/><rect x="436" y="828" width="26" height="16"/>
    <rect x="600" y="828" width="26" height="16"/><rect x="656" y="828" width="26" height="16"/>
    <rect x="820" y="828" width="26" height="16"/><rect x="876" y="828" width="26" height="16"/>
    <rect x="1040" y="828" width="26" height="16"/><rect x="1096" y="828" width="26" height="16"/>
    <rect x="1260" y="828" width="26" height="16"/><rect x="1316" y="828" width="26" height="16"/>
    <rect x="1480" y="828" width="26" height="16"/><rect x="1536" y="828" width="26" height="16"/>
  </g>
  <!-- treeline -->
  <g fill="#081914">
    <circle cx="120" cy="806" r="30"/><circle cx="165" cy="812" r="24"/>
    <circle cx="700" cy="808" r="28"/><circle cx="742" cy="814" r="22"/>
    <circle cx="1230" cy="804" r="32"/><circle cx="1278" cy="812" r="24"/>
  </g>
</svg>
