<!doctype html>
<html lang="en-IN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AI-COS — construction and redevelopment ERP" />
    <title>AI-COS</title>
    <!--
      Inlined as a data URI so the browser never requests /favicon.ico, which
      would 404 and surface as a console error on every page load.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131920'/%3E%3Crect x='5' y='5' width='22' height='22' fill='%23D8E524'/%3E%3Cpath d='M10 22V13l6-4 6 4v9' fill='none' stroke='%23131920' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('aicos.theme');
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var theme = stored === 'light' || stored === 'dark' ? stored : mql.matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
